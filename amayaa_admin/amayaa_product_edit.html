<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Edit Product – Amayaa Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
<style>
.fi{padding:9px 12px;border:1.5px solid rgba(0,0,0,.12);border-radius:8px;font-family:'Jost',sans-serif;font-size:14px;background:rgba(255,255,255,.88);color:#1A1208;width:100%;transition:border-color .2s;}
.fi:focus{outline:none;border-color:#C4622D;}
.fi[readonly]{background:#F5F0EA;color:#9A8070;cursor:not-allowed;}
.fta{padding:9px 12px;border:1.5px solid rgba(0,0,0,.12);border-radius:8px;font-family:'Jost',sans-serif;font-size:14px;background:rgba(255,255,255,.88);color:#1A1208;width:100%;resize:vertical;min-height:80px;transition:border-color .2s;}
.fta:focus{outline:none;border-color:#C4622D;}
.fse{padding:9px 12px;border:1.5px solid rgba(0,0,0,.12);border-radius:8px;font-family:'Jost',sans-serif;font-size:14px;background:rgba(255,255,255,.88);color:#1A1208;width:100%;}
.fse:focus{outline:none;border-color:#C4622D;}

.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;}
.fg label,.form-label{font-size:12px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:#9A8070;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
.grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:14px;}

.section-card{background:rgba(255,255,255,.88);border:1px solid rgba(0,0,0,.07);border-radius:14px;margin-bottom:16px;overflow:hidden;}
.section-head{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(0,0,0,.06);background:rgba(255,255,255,.6);}
.section-title{font-size:13px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#5A4030;}
.section-body{padding:20px;}

.pill-group{display:flex;flex-wrap:wrap;gap:8px;}
.pill-check{display:none;}
.pill-label{display:inline-flex;align-items:center;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1.5px solid rgba(0,0,0,.12);background:rgba(255,255,255,.7);color:#5A4030;transition:all .2s;user-select:none;}
.pill-check:checked+.pill-label{background:#C4622D;border-color:#C4622D;color:white;}

.color-row{display:flex;align-items:center;gap:10px;}
.color-preview{width:36px;height:36px;border-radius:8px;border:1.5px solid rgba(0,0,0,.12);flex-shrink:0;}

.preview-band{height:8px;border-radius:4px;margin-bottom:10px;transition:all .3s;}

.lib-resolved{font-size:12px;color:#5A4030;background:rgba(196,98,45,.07);border-radius:8px;padding:10px 12px;margin-top:6px;border-left:3px solid rgba(196,98,45,.3);line-height:1.55;display:none;}

.photos-list{display:flex;flex-direction:column;gap:8px;}
.photo-row{display:flex;align-items:center;gap:8px;}
.photo-row .fi{flex:1;}

.save-bar{position:sticky;bottom:0;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);border-top:1px solid rgba(0,0,0,.08);padding:12px 30px;display:flex;align-items:center;justify-content:flex-end;gap:12px;z-index:30;}

.loading-state{text-align:center;padding:60px 20px;color:#9A8070;}
.loading-state .spinner{width:40px;height:40px;border:3px solid rgba(196,98,45,.2);border-top-color:#C4622D;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<script src="sidebar.js"></script>
<div class="main">
  <div class="topbar">
    <div>
      <div class="topbar-title" id="pageTitle">Edit Product</div>
      <div class="topbar-sub" id="pageSub">Loading…</div>
    </div>
    <div class="topbar-actions">
      <span id="saveIndicator" class="save-indicator" style="font-size:12px;color:#2E7D32;font-weight:600;opacity:0;transition:opacity .4s;">&#10003; Saved to GitHub</span>
      <button class="btn btn-ghost" onclick="window.location.href='amayaa_products.html'">&#8592; Back</button>
      <button class="btn btn-primary" onclick="_save()">&#128190; Save Changes</button>
    </div>
  </div>
  <div class="content" id="mainContent">
    <div class="loading-state">
      <div class="spinner"></div>
      Loading product…
    </div>
  </div>
</div>

<script>
var _pid = (new URLSearchParams(location.search)).get('id') || '';
var _product = null;
var _library = null;
var _productSha = null;
var _indexSha = null;
var _indexData = null;

// ── GitHub helpers ─────────────────────────────────────
function _tok(){return localStorage.getItem('amayaa_gh_token');}
function _ghGet(path,cb){
  if(!_tok()){alert('GitHub token missing — go to Site Settings.');return;}
  fetch('https://api.github.com/repos/Amayaa-2026/amayaa-website/contents/'+path,
    {headers:{'Authorization':'token '+_tok(),'Accept':'application/vnd.github.v3+json'}})
    .then(function(r){return r.json();}).then(cb).catch(function(e){console.error(e);});
}
function _ghPut(path,content,msg,sha,cb){
  if(!_tok()){alert('GitHub token missing.');return;}
  var body={message:msg,content:btoa(unescape(encodeURIComponent(content)))};
  if(sha)body.sha=sha;
  fetch('https://api.github.com/repos/Amayaa-2026/amayaa-website/contents/'+path,{
    method:'PUT',
    headers:{'Authorization':'token '+_tok(),'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},
    body:JSON.stringify(body)
  }).then(function(r){return r.json();}).then(function(res){if(cb)cb(res);}).catch(function(e){console.error(e);});
}
function _b64d(s){return decodeURIComponent(escape(atob(s.replace(/\n/g,''))));}

// ── Load ──────────────────────────────────────────────
var _loaded = 0;
function _checkReady(){
  _loaded++;
  if(_loaded>=3) _render();
}

function _load(){
  if(!_pid){
    document.getElementById('mainContent').innerHTML='<div class="alert alert-info">No product ID specified. <a href="amayaa_products.html">Go back to Products.</a></div>';
    return;
  }
  // Load product detail
  _ghGet('data/products/'+_pid+'.json',function(res){
    _productSha = res.sha;
    _product = JSON.parse(_b64d(res.content));
    _checkReady();
  });
  // Load content library
  _ghGet('data/content_library.json',function(res){
    _library = JSON.parse(_b64d(res.content));
    _checkReady();
  });
  // Load products index
  _ghGet('data/products.json',function(res){
    _indexSha = res.sha;
    _indexData = JSON.parse(_b64d(res.content));
    _checkReady();
  });
}

// ── Render form ───────────────────────────────────────
function _render(){
  var p = _product;
  document.getElementById('pageTitle').textContent = p.name || 'Edit Product';
  document.getElementById('pageSub').textContent = p.id + (p.region ? ' · '+p.region : '');

  var html = '';

  // ── Section 1: Basic Info
  html += _secOpen('&#129528; Basic Information');
  html += '<div class="grid2">';
  html += _fg('Product ID (read-only)','<input type="text" class="fi" id="fId" value="'+_esc(p.id)+'" readonly>');
  html += _fg('Product Name','<input type="text" class="fi" id="fName" value="'+_esc(p.name||'')+'" placeholder="e.g. Katan Silk Banarasi Saree">');
  html += '</div>';
  html += '<div class="grid3">';
  html += _fg('Type','<input type="text" class="fi" id="fType" value="'+_esc(p.type||'')+'" placeholder="Banarasi">');
  html += _fg('Region','<input type="text" class="fi" id="fRegion" value="'+_esc(p.region||'')+'" placeholder="Varanasi, UP">');
  html += _fg('Fabric','<input type="text" class="fi" id="fFabric" value="'+_esc(p.fabric||'')+'" placeholder="Katan Silk">');
  html += '</div>';
  html += '<div class="grid2">';
  html += _fg('Colour / Colour Description','<input type="text" class="fi" id="fColour" value="'+_esc(p.colour||'')+'" placeholder="Deep Red with Gold Zari Border">');
  html += _fg('Status',
    '<select class="fse" id="fStatus">'
    +'<option value="active"'+(p.status==='active'?' selected':'')+'>Active</option>'
    +'<option value="draft"'+(p.status==='draft'?' selected':'')+'>Draft</option>'
    +'<option value="hidden"'+(p.status==='hidden'?' selected':'')+'>Hidden</option>'
    +'<option value="sold-out"'+(p.status==='sold-out'?' selected':'')+'>Sold Out</option>'
    +'</select>');
  html += '</div>';
  html += '<div class="fg">';
  html += '<label class="form-label">Options</label>';
  html += '<div style="display:flex;gap:20px;align-items:center;padding:4px 0;">';
  html += '<label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;">';
  html += '<input type="checkbox" id="fFeatured"'+(p.featured?' checked':'')+' style="width:16px;height:16px;accent-color:#C4622D;"> Featured product</label>';
  html += '<label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;">';
  html += '<input type="checkbox" id="fGiTagged"'+(p.giTagged?' checked':'')+' style="width:16px;height:16px;accent-color:#C4622D;"> GI Tagged</label>';
  html += '<label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;">';
  html += '<input type="checkbox" id="fBlouseIncluded"'+(p.blouseIncluded?' checked':'')+' style="width:16px;height:16px;accent-color:#C4622D;"> Blouse included</label>';
  html += '</div></div>';
  html += _secClose();

  // ── Section 2: Pricing
  html += _secOpen('&#128176; Pricing');
  html += '<div class="grid3">';
  html += _fg('Price (₹)','<input type="number" class="fi" id="fPrice" value="'+(p.price||'')+'" placeholder="8500" min="0">');
  html += _fg('Original Price (₹) — blank = no strikethrough','<input type="number" class="fi" id="fOriginalPrice" value="'+(p.originalPrice||'')+'" placeholder="leave blank if no offer">');
  html += _fg('Offer Valid Until','<input type="date" class="fi" id="fOfferValidUntil" value="'+(p.offerValidUntil||'')+'" >');
  html += '</div>';
  html += _secClose();

  // ── Section 3: Physical
  html += _secOpen('&#128110; Physical Details');
  html += '<div class="grid3">';
  html += _fg('Length','<input type="text" class="fi" id="fLength" value="'+_esc(p.length||'')+'" placeholder="6.3 metres">');
  html += _fg('Blouse Piece','<input type="text" class="fi" id="fBlousePiece" value="'+_esc(p.blousePiece||'')+'" placeholder="Included — 0.8 metres">');
  html += _fg('Weaving Days','<input type="text" class="fi" id="fWeavingDays" value="'+_esc(p.weavingDays||'')+'" placeholder="15–20">');
  html += '</div>';
  html += _fg('Weave Type','<input type="text" class="fi" id="fWeaveType" value="'+_esc(p.weaveType||'')+'" placeholder="Handloom Brocade — Meenakari">');
  html += _secClose();

  // ── Section 4: Badges & Occasions
  var allBadges = ['new','offer','bestseller','gi-tagged','sold-out'];
  var allOccasions = ['wedding','festive','puja','casual','formal','party','daily'];
  html += _secOpen('&#127991; Badges & Occasions');
  html += '<div class="fg"><label class="form-label">Badges</label><div class="pill-group" id="badgeGroup">';
  allBadges.forEach(function(b){
    var chk = (p.badges||[]).indexOf(b)>-1?' checked':'';
    html += '<input type="checkbox" class="pill-check" id="badge_'+b+'" value="'+b+'"'+chk+'>';
    html += '<label class="pill-label" for="badge_'+b+'">'+b+'</label>';
  });
  html += '</div></div>';
  html += '<div class="fg"><label class="form-label">Occasions</label><div class="pill-group" id="occGroup">';
  allOccasions.forEach(function(o){
    var chk = (p.occasion||[]).indexOf(o)>-1?' checked':'';
    html += '<input type="checkbox" class="pill-check" id="occ_'+o+'" value="'+o+'"'+chk+'>';
    html += '<label class="pill-label" for="occ_'+o+'">'+o+'</label>';
  });
  html += '</div></div>';
  html += _fg('Tags (comma-separated)','<input type="text" class="fi" id="fTags" value="'+_esc((p.tags||[]).join(', '))+'" placeholder="silk, banarasi, zari, wedding">');
  html += _secClose();

  // ── Section 5: Content (library)
  html += _secOpen('&#128196; Content');
  html += _fg('Short Description (free text — shown in cards)',
    '<textarea class="fta" id="fShortDesc" rows="3">'+_esc(p.shortDescription||'')+'</textarea>');
  // Library dropdowns
  ['description','weaveStory','careInstructions'].forEach(function(field){
    var cat = field;
    var entries = (_library[cat]||[]);
    var cur = p[field]||'';
    var label = field==='description'?'Description':field==='weaveStory'?'Weave Story':'Care Instructions';
    html += '<div class="fg">';
    html += '<label class="form-label">'+label+' <span style="font-weight:400;text-transform:none;letter-spacing:0;font-size:11px;color:#C4622D;">(select from library)</span></label>';
    html += '<select class="fse" id="f_'+field+'" onchange="_previewLib(\''+field+'\')">';
    html += '<option value="">— choose —</option>';
    entries.forEach(function(e){
      html += '<option value="'+_esc(e.key)+'"'+(e.key===cur?' selected':'')+'>'+_esc(e.label)+'</option>';
    });
    html += '</select>';
    // resolved preview
    var resolved = entries.find(function(e){return e.key===cur;});
    html += '<div class="lib-resolved" id="pr_'+field+'"'+(resolved?' style="display:block"':'')+'>'+_esc(resolved?resolved.text:'')+'</div>';
    html += '</div>';
  });
  html += _secClose();

  // ── Section 6: Gradient Swatches
  html += _secOpen('&#127750; Gradient & Swatch');
  html += '<div id="gradPreview" class="preview-band" style="background:linear-gradient(135deg,'+_esc(p.gradientFrom||'#888')+','+_esc(p.gradientTo||'#aaa')+');"></div>';
  html += '<div class="grid2">';
  html += '<div class="fg"><label class="form-label">Gradient From</label>';
  html += '<div class="color-row"><input type="color" id="fGradFrom" value="'+(p.gradientFrom||'#888888')+'" oninput="_updateGrad()" style="width:50px;height:36px;border:none;background:none;cursor:pointer;">';
  html += '<input type="text" class="fi" id="fGradFromTxt" value="'+_esc(p.gradientFrom||'')+'" style="max-width:140px;" oninput="_syncColor(\'From\')" placeholder="#C4622D">';
  html += '</div></div>';
  html += '<div class="fg"><label class="form-label">Gradient To</label>';
  html += '<div class="color-row"><input type="color" id="fGradTo" value="'+(p.gradientTo||'#aaaaaa')+'" oninput="_updateGrad()" style="width:50px;height:36px;border:none;background:none;cursor:pointer;">';
  html += '<input type="text" class="fi" id="fGradToTxt" value="'+_esc(p.gradientTo||'')+'" style="max-width:140px;" oninput="_syncColor(\'To\')" placeholder="#E8843D">';
  html += '</div></div>';
  html += '</div>';
  html += _secClose();

  // ── Section 7: Media
  html += _secOpen('&#128247; Media');
  html += _fg('Thumbnail Path','<input type="text" class="fi" id="fThumbnail" value="'+_esc(p.thumbnail||'')+'" placeholder="images/products/AMY-BAN-001.jpg">');
  html += '<div class="fg"><label class="form-label">Photo Gallery (one path per line)</label>';
  html += '<textarea class="fta" id="fPhotos" rows="5" placeholder="images/products/AMY-BAN-001-1.jpg&#10;images/products/AMY-BAN-001-2.jpg">'+_esc((p.photos||[]).join('\n'))+'</textarea>';
  html += '</div>';
  html += _secClose();

  // ── Section 8: SEO
  html += _secOpen('&#128270; SEO');
  html += _fg('SEO Title','<input type="text" class="fi" id="fSeoTitle" value="'+_esc(p.seoTitle||'')+'" placeholder="Buy Katan Silk Banarasi Saree | Amayaa by Polka Dots">');
  html += _fg('SEO Description','<textarea class="fta" id="fSeoDescription" rows="3" placeholder="Handloom Katan silk Banarasi saree…">'+_esc(p.seoDescription||'')+'</textarea>');
  html += _secClose();

  // save bar
  html += '<div class="save-bar">';
  html += '<a href="amayaa_products.html" class="btn btn-ghost">Cancel</a>';
  html += '<button class="btn btn-primary" onclick="_save()">&#128190; Save Changes</button>';
  html += '</div>';

  document.getElementById('mainContent').innerHTML = html;
  // show initial previews
  ['description','weaveStory','careInstructions'].forEach(function(f){_previewLib(f,true);});
}

// ── Helpers ───────────────────────────────────────────
function _secOpen(title){
  return '<div class="section-card"><div class="section-head"><span class="section-title">'+title+'</span></div><div class="section-body">';
}
function _secClose(){return '</div></div>';}
function _fg(label,control){return '<div class="fg"><label class="form-label">'+label+'</label>'+control+'</div>';}
function _esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function _previewLib(field, silent){
  var sel = document.getElementById('f_'+field);
  var pr  = document.getElementById('pr_'+field);
  if(!sel||!pr)return;
  var key = sel.value;
  var entry = (_library[field]||[]).find(function(e){return e.key===key;});
  if(entry){
    pr.textContent = entry.text;
    pr.style.display = 'block';
  } else {
    pr.textContent = '';
    pr.style.display = 'none';
  }
}

function _updateGrad(){
  var f = document.getElementById('fGradFrom').value;
  var t = document.getElementById('fGradTo').value;
  document.getElementById('fGradFromTxt').value = f;
  document.getElementById('fGradToTxt').value = t;
  document.getElementById('gradPreview').style.background = 'linear-gradient(135deg,'+f+','+t+')';
}
function _syncColor(which){
  var txt = document.getElementById('fGradFrom'+which+'Txt').value;
  if(/^#[0-9a-fA-F]{6}$/.test(txt)){
    document.getElementById('fGradFrom'+which).value = txt;
    document.getElementById('gradPreview').style.background =
      'linear-gradient(135deg,'+document.getElementById('fGradFromTxt').value+','+document.getElementById('fGradToTxt').value+')';
  }
}

// ── Collect & Save ────────────────────────────────────
function _collect(){
  var p = {};
  p.id = _pid;
  p.name = document.getElementById('fName').value.trim();
  p.type = document.getElementById('fType').value.trim();
  p.region = document.getElementById('fRegion').value.trim();
  p.fabric = document.getElementById('fFabric').value.trim();
  p.colour = document.getElementById('fColour').value.trim();
  p.price = parseFloat(document.getElementById('fPrice').value)||0;
  var op = document.getElementById('fOriginalPrice').value.trim();
  p.originalPrice = op ? parseFloat(op) : null;
  var ovu = document.getElementById('fOfferValidUntil').value.trim();
  p.offerValidUntil = ovu || null;
  p.status = document.getElementById('fStatus').value;
  p.featured = document.getElementById('fFeatured').checked;
  p.giTagged = document.getElementById('fGiTagged').checked;
  p.blouseIncluded = document.getElementById('fBlouseIncluded').checked;
  p.length = document.getElementById('fLength').value.trim();
  p.blousePiece = document.getElementById('fBlousePiece').value.trim();
  p.weavingDays = document.getElementById('fWeavingDays').value.trim();
  p.weaveType = document.getElementById('fWeaveType').value.trim();

  // badges
  p.badges = [];
  document.querySelectorAll('#badgeGroup .pill-check:checked').forEach(function(c){p.badges.push(c.value);});
  // occasions
  p.occasion = [];
  document.querySelectorAll('#occGroup .pill-check:checked').forEach(function(c){p.occasion.push(c.value);});
  // tags
  p.tags = document.getElementById('fTags').value.split(',').map(function(t){return t.trim();}).filter(Boolean);

  p.shortDescription = document.getElementById('fShortDesc').value.trim();
  p.description = document.getElementById('f_description').value;
  p.weaveStory = document.getElementById('f_weaveStory').value;
  p.careInstructions = document.getElementById('f_careInstructions').value;

  p.gradientFrom = document.getElementById('fGradFromTxt').value.trim() || document.getElementById('fGradFrom').value;
  p.gradientTo   = document.getElementById('fGradToTxt').value.trim()   || document.getElementById('fGradTo').value;

  p.thumbnail = document.getElementById('fThumbnail').value.trim();
  var photosRaw = document.getElementById('fPhotos').value;
  p.photos = photosRaw.split('\n').map(function(l){return l.trim();}).filter(Boolean);

  p.seoTitle = document.getElementById('fSeoTitle').value.trim();
  p.seoDescription = document.getElementById('fSeoDescription').value.trim();

  return p;
}

function _save(){
  var p = _collect();
  _product = p;

  var detailJson = JSON.stringify(p, null, 2);

  // Update index entry
  var idx = _indexData.findIndex(function(e){return e.id===_pid;});
  if(idx>-1){
    var entry = _indexData[idx];
    // Copy all fields that live in index
    ['name','type','region','fabric','colour','price','originalPrice','status','featured','badges',
     'occasion','length','blousePiece','blouseIncluded','weaveType','gradientFrom','gradientTo',
     'shortDescription','tags','photos','description','weaveStory','weavingDays','careInstructions',
     'giTagged','seoTitle','seoDescription','offerValidUntil'].forEach(function(k){
       entry[k] = p[k];
     });
    _indexData[idx] = entry;
  }

  var savedCount = 0;
  function _done(res){
    if(res && res.content && res.content.sha){
      // update sha
    }
    savedCount++;
    if(savedCount>=2){
      var si = document.getElementById('saveIndicator');
      si.style.opacity='1';
      setTimeout(function(){si.style.opacity='0';},3000);
    }
  }

  _ghPut('data/products/'+_pid+'.json', detailJson, 'Admin: update product '+_pid, _productSha, function(res){
    if(res.content && res.content.sha) _productSha = res.content.sha;
    _done(res);
  });
  _ghPut('data/products.json', JSON.stringify(_indexData, null, 2), 'Admin: update products index ('+_pid+')', _indexSha, function(res){
    if(res.content && res.content.sha) _indexSha = res.content.sha;
    _done(res);
  });
}

_load();
</script>
</body>
</html>
