/* ── AMAYAA ADMIN SHARED SIDEBAR CSS ── */
aside.sidebar{position:fixed;top:0;left:0;width:240px;height:100vh;background:radial-gradient(ellipse at 15% 25%,rgba(240,67,147,.55) 0%,transparent 55%),radial-gradient(ellipse at 85% 75%,rgba(240,67,147,.45) 0%,transparent 50%),radial-gradient(ellipse at 50% 10%,rgba(200,30,110,.40) 0%,transparent 45%),#2A0A1A;color:white;overflow-y:auto;z-index:100;display:flex;flex-direction:column;}
.sb-brand{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:12px;flex-shrink:0;}
.sb-logo-img{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.2);flex-shrink:0;}
.sb-text{display:flex;flex-direction:column;gap:2px;min-width:0;}
.sb-name{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;color:white;letter-spacing:.3px;line-height:1.1;white-space:nowrap;}
.sb-sub{font-size:10px;opacity:.55;letter-spacing:2.5px;text-transform:uppercase;color:white;white-space:nowrap;}
.sb-nav{flex:1;padding:8px 0;overflow-y:auto;}
.sb-section{font-size:10px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;opacity:.45;padding:16px 20px 5px;color:white;}
.sb-link{display:flex;align-items:center;gap:10px;padding:10px 20px;color:rgba(255,255,255,.72);text-decoration:none;font-size:14px;font-weight:500;transition:all .2s;border-left:3px solid transparent;white-space:nowrap;}
.sb-link:hover{background:rgba(255,255,255,.08);color:white;border-left-color:rgba(196,98,45,.5);}
.sb-link.active{background:rgba(196,98,45,.18);color:white;border-left-color:#C4622D;}
.sb-icon{width:18px;text-align:center;font-size:15px;flex-shrink:0;}
.sb-footer{padding:14px 18px;border-top:1px solid rgba(255,255,255,.1);flex-shrink:0;}
.sb-logout{width:100%;padding:9px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:8px;color:rgba(255,255,255,.7);font-family:'Jost',sans-serif;font-size:13px;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px;}
.sb-logout:hover{background:rgba(255,255,255,.15);color:white;}


*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Jost',sans-serif;background:linear-gradient(135deg,#E4DFD9 0%,#D8D2CB 100%);color:#1A1208;font-size:14px;min-height:100vh;}

/* SIDEBAR — warm dark */



.sb-brand img{height:42px;width:auto;}







.sb-link .ic{width:18px;text-align:center;font-size:14px;}




/* MAIN */
.main{margin-left:240px;flex:1;display:flex;flex-direction:column;min-height:100vh;}
.topbar{padding:18px 30px;border-bottom:1px solid rgba(0,0,0,.08);background:rgba(255,255,255,.7);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
.topbar-title{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:700;color:#1A0A04;}
.topbar-sub{font-size:13px;color:#9A8070;margin-top:2px;}
.topbar-actions{display:flex;gap:10px;}
.content{padding:24px 30px;flex:1;}

/* CARDS */
.card{background:white;border:1px solid rgba(0,0,0,.07);border-radius:16px;padding:22px;box-shadow:0 2px 12px rgba(0,0,0,.05);}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid rgba(0,0,0,.06);}
.card-title{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:400;color:#1A0A04;}
.card-sub{font-size:12px;color:#9A8070;margin-top:2px;}

/* STAT CARDS */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
.stat{background:white;border:1px solid rgba(0,0,0,.07);border-radius:14px;padding:18px;position:relative;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.04);}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;}
.stat.s1::before{background:linear-gradient(90deg,#C4622D,#E8A020);}
.stat.s2::before{background:linear-gradient(90deg,#7B2D8B,#B44FD0);}
.stat.s3::before{background:linear-gradient(90deg,#25D366,#128C7E);}
.stat.s4::before{background:linear-gradient(90deg,#1A6AAA,#2A9ADD);}
.stat-val{font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:300;color:#1A0A04;line-height:1;}
.stat-label{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#9A8070;margin-top:6px;}
.stat-sub{font-size:11px;color:#B0967E;margin-top:4px;}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:9px;border:none;cursor:pointer;font-family:'Jost',sans-serif;font-size:13px;font-weight:600;letter-spacing:1px;text-transform:uppercase;transition:all .2s;text-decoration:none;}
.btn-primary{background:linear-gradient(135deg,#C4622D,#E8843D);color:white;}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(196,98,45,.35);}
.btn-success{background:linear-gradient(135deg,#25D366,#128C7E);color:white;}
.btn-success:hover{transform:translateY(-1px);}
.btn-ghost{background:transparent;color:#5A4030;border:1.5px solid rgba(0,0,0,.14);}
.btn-ghost:hover{background:rgba(0,0,0,.04);}
.btn-danger{background:rgba(220,50,50,.08);color:#CC3333;border:1px solid rgba(220,50,50,.2);}
.btn-danger:hover{background:rgba(220,50,50,.15);}
.btn-edit{background:rgba(196,98,45,.1);color:#C4622D;border:1px solid rgba(196,98,45,.25);}
.btn-edit:hover{background:rgba(196,98,45,.18);}
.btn-save{background:linear-gradient(135deg,#25D366,#128C7E);color:white;}
.btn-sm{padding:5px 11px;font-size:12px;}

/* TABLES */
.tbl{width:100%;border-collapse:collapse;}
.tbl th{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#9A8070;padding:9px 13px;text-align:left;border-bottom:1.5px solid rgba(0,0,0,.07);background:rgba(240,230,216,.5);}
.tbl td{padding:11px 13px;border-bottom:1px solid rgba(0,0,0,.05);font-size:13px;color:#3A2A1A;vertical-align:middle;}
.tbl tr:hover td{background:rgba(196,98,45,.03);}
.tbl tr:last-child td{border-bottom:none;}

/* BADGES */
.badge{display:inline-block;padding:3px 9px;border-radius:10px;font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;}
.badge-offer{background:rgba(123,45,139,.1);color:#7B2D8B;border:1px solid rgba(123,45,139,.2);}
.badge-sold{background:rgba(80,80,80,.1);color:#666;border:1px solid rgba(0,0,0,.12);}
.badge-active{background:rgba(37,211,102,.1);color:#1A7A40;border:1px solid rgba(37,211,102,.25);}
.badge-hidden{background:rgba(0,0,0,.06);color:#9A8070;border:1px solid rgba(0,0,0,.1);}
.badge-new{background:rgba(196,98,45,.12);color:#A04010;border:1px solid rgba(196,98,45,.25);}
.badge-draft{background:rgba(200,150,0,.1);color:#7A5A00;border:1px solid rgba(200,150,0,.25);}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.form-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
.fg{margin-bottom:16px;}
.fg label{display:block;font-size:12px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:#7A6050;margin-bottom:6px;}
.fi,.fta,.fse{width:100%;padding:10px 13px;border-radius:9px;border:1.5px solid rgba(0,0,0,.1);background:rgba(240,230,216,.5);font-family:'Jost',sans-serif;font-size:13px;color:#1A1208;outline:none;transition:border-color .2s;}
.fi:focus,.fta:focus,.fse:focus{border-color:#C4622D;background:white;}
.fi::placeholder,.fta::placeholder{color:#C0A888;}
.fi:disabled,.fta:disabled,.fse:disabled{background:#F5F0EA;color:#B0967E;cursor:not-allowed;}
.fse{cursor:pointer;appearance:none;background-image:url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l5 5 5-5' stroke='%23C4622D' stroke-width='1.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 13px center;padding-right:34px;background-color:#FAFAF8;}
.fse:disabled{background-color:#F5F0EA;}

/* AUTOCOMPLETE */
.toggle-wrap{display:flex;align-items:center;gap:10px;}
.toggle{position:relative;width:42px;height:22px;}
.toggle input{opacity:0;width:0;height:0;}
.toggle-slider{position:absolute;inset:0;background:rgba(0,0,0,.15);border-radius:22px;cursor:pointer;transition:.3s;}
.toggle-slider:before{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;background:white;border-radius:50%;transition:.3s;box-shadow:0 1px 4px rgba(0,0,0,.2);}
.toggle input:checked+.toggle-slider{background:#C4622D;}
.toggle input:checked+.toggle-slider:before{transform:translateX(20px);}
.toggle-label{font-size:13px;color:#5A4030;}

/* SEARCH BAR */
.search-bar{position:relative;margin-bottom:18px;}
.search-bar input{width:100%;padding:10px 13px 10px 40px;border-radius:9px;border:1.5px solid rgba(0,0,0,.1);background:white;font-family:'Jost',sans-serif;font-size:13px;color:#1A1208;outline:none;transition:all .2s;}
.search-bar input:focus{border-color:#C4622D;}
.search-bar input::placeholder{color:#C0A888;}
.search-bar svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#C0A888;}

/* QUICK ACTIONS */
.qa-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:24px;}
.qa{padding:16px 12px;border-radius:13px;background:white;border:1px solid rgba(0,0,0,.07);text-align:center;cursor:pointer;transition:all .2s;text-decoration:none;display:block;box-shadow:0 2px 8px rgba(0,0,0,.04);}
.qa:hover{border-color:rgba(196,98,45,.35);transform:translateY(-2px);box-shadow:0 6px 18px rgba(196,98,45,.1);}
.qa-icon{font-size:22px;margin-bottom:7px;}
.qa-label{font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:#7A6050;}

/* FILTER PILLS */
.filter-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.filter-pill{padding:5px 13px;border-radius:18px;border:1.5px solid rgba(0,0,0,.1);background:white;color:#7A6050;font-size:12px;font-weight:500;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:all .2s;}
.filter-pill:hover,.filter-pill.active{background:rgba(196,98,45,.12);border-color:rgba(196,98,45,.4);color:#A04010;}

/* PAGINATION */
.pag{display:flex;gap:5px;align-items:center;margin-top:16px;}
.pag-btn{width:30px;height:30px;border-radius:7px;border:1px solid rgba(0,0,0,.1);background:white;color:#7A6050;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.pag-btn:hover,.pag-btn.active{background:rgba(196,98,45,.15);border-color:rgba(196,98,45,.4);color:#A04010;}

/* PRODUCT THUMB */
.prod-thumb{width:42px;height:50px;border-radius:8px;flex-shrink:0;}

/* ALERT */
.alert{padding:11px 15px;border-radius:9px;font-size:14px;margin-bottom:15px;display:flex;align-items:center;gap:9px;}
.alert-success{background:rgba(37,211,102,.08);border:1px solid rgba(37,211,102,.2);color:#1A7A40;}
.alert-info{background:rgba(196,98,45,.08);border:1px solid rgba(196,98,45,.2);color:#A04010;}

/* RTE */
.rte-toolbar{display:flex;gap:3px;padding:7px;background:#F5F0EA;border-radius:8px 8px 0 0;border:1.5px solid rgba(0,0,0,.1);border-bottom:none;flex-wrap:wrap;}
.rte-btn{padding:4px 8px;border-radius:5px;border:none;background:transparent;color:#7A6050;cursor:pointer;font-size:12px;font-weight:600;transition:all .2s;}
.rte-btn:hover{background:rgba(0,0,0,.07);}
.rte-area{min-height:140px;padding:13px;background:white;border:1.5px solid rgba(0,0,0,.1);border-radius:0 0 8px 8px;color:#3A2A1A;font-size:14px;line-height:1.7;outline:none;}
.rte-area:focus{border-color:#C4622D;}

/* SECTION LOCK STATE */
.section-locked .fi,.section-locked .fta,.section-locked .fse{background:#F5F0EA;pointer-events:none;color:#9A8070;}
.section-locked .fi:focus,.section-locked .fta:focus{border-color:rgba(0,0,0,.1);}

/* BANNER */
.banner-card{border-radius:12px;overflow:hidden;border:2px solid rgba(0,0,0,.08);transition:all .2s;cursor:pointer;background:white;}
.banner-card.active-slide{border-color:#C4622D;box-shadow:0 0 0 3px rgba(196,98,45,.15);}
.banner-preview{height:90px;display:flex;align-items:center;justify-content:center;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.6);}
.banner-num{padding:7px 11px;font-size:12px;font-weight:600;letter-spacing:1px;color:#7A6050;background:rgba(240,230,216,.5);border-top:1px solid rgba(0,0,0,.06);}

/* SWATCH */
.swatch-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:5px;}
.swatch{width:26px;height:26px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:all .2s;position:relative;}
.swatch.selected{border-color:#C4622D;transform:scale(1.15);}
.swatch.selected::after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:white;text-shadow:0 1px 3px rgba(0,0,0,.6);}

/* BC */
.bc{display:flex;align-items:center;gap:6px;font-size:13px;color:#B0967E;margin-bottom:18px;}
.bc a{color:#C4622D;text-decoration:none;}
.bc span{color:#D0C0B0;}


/* Page-specific */

<script>
/* ── GitHub API helpers ── */
var GH_REPO = 'Amayaa-2026/amayaa-website';
var GH_BRANCH = 'main';
function _b64ToUtf8(b64){var raw=atob(b64.replace(/\n/g,''));var bytes=new Uint8Array(raw.length);for(var i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);return new TextDecoder('utf-8',{fatal:false}).decode(bytes);}
function _utf8ToB64(str){var bytes=new TextEncoder().encode(str);var bin='';for(var i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);return btoa(bin);}
function _ghTok(){return localStorage.getItem('amayaa_gh_token')||'';}
function _ghHdrs(){return{Authorization:'token '+_ghTok(),Accept:'application/vnd.github.v3+json','Content-Type':'application/json'};}
function _ghSave(filePath,dat,msg,btnEl){
  var tok=_ghTok();
  if(!tok){alert('No GitHub token. Set it in Admin → Settings first.');return;}
  var orig=btnEl?btnEl.textContent:'';
  if(btnEl){btnEl.textContent='Saving…';btnEl.disabled=true;}
  fetch('https://api.github.com/repos/'+GH_REPO+'/contents/'+filePath+'?ref='+GH_BRANCH,{headers:_ghHdrs()})
    .then(function(r){return r.json();})
    .then(function(ex){
      if(!ex.sha)throw new Error(ex.message||'No SHA');
      return fetch('https://api.github.com/repos/'+GH_REPO+'/contents/'+filePath,{method:'PUT',headers:_ghHdrs(),body:JSON.stringify({message:msg,content:_utf8ToB64(JSON.stringify(dat,null,2)),sha:ex.sha,branch:GH_BRANCH})});
    })
    .then(function(r){return r.json();})
    .then(function(res){
      if(res.content){
        if(btnEl){btnEl.textContent='✅ Saved!';setTimeout(function(){btnEl.textContent=orig;btnEl.disabled=false;},2500);}
        else{var t=document.createElement('div');t.style.cssText='position:fixed;top:20px;right:20px;z-index:9999;padding:12px 20px;border-radius:10px;background:#D4F0DD;border:1px solid #1A7A40;color:#1A7A40;font-family:Jost,sans-serif;font-weight:600;font-size:14px;';t.textContent='✅ Saved to GitHub!';document.body.appendChild(t);setTimeout(function(){t.remove();},3000);}
      }else{throw new Error(res.message||'Write failed');}
    })
    .catch(function(e){alert('Save failed: '+(e.message||e));if(btnEl){btnEl.textContent=orig;btnEl.disabled=false;}});
}

/* ── Product manager ── */
var _products = [];
var _filtered = [];
var _activeFilter = 'all';
var PAGE_SIZE = 50;
var _curPage = 0;

function _statusBadge(status){
  if(status==='active') return '<span class="badge badge-active">Active</span>';
  if(status==='sold_out') return '<span class="badge badge-sold">Sold Out</span>';
  return '<span class="badge badge-hidden">Hidden</span>';
}

function _renderTable(){
  var tbody=document.getElementById('productsTableBody');
  if(!tbody)return;
  var page=_filtered.slice(_curPage*PAGE_SIZE,(_curPage+1)*PAGE_SIZE);
  if(!page.length){
    tbody.innerHTML='<tr><td colspan="7" style="text-align:center;color:#9A8070;padding:30px;">No products found.</td></tr>';
    return;
  }
  tbody.innerHTML=page.map(function(p){
    var priceHtml=p.originalPrice
      ?'<span style="text-decoration:line-through;color:#B0967E;font-size:11px;">&#8377;'+p.originalPrice.toLocaleString('en-IN')+'</span><br><strong style="color:#C4622D;">&#8377;'+p.price.toLocaleString('en-IN')+'</strong>'
      :'<span style="font-weight:600;color:#1A0A04;">&#8377;'+p.price.toLocaleString('en-IN')+'</span>';
    var toggleBtn=p.status==='active'
      ?'<button class="btn btn-danger btn-sm" onclick="_toggleStatus(\''+p.id+'\')">&#128308; Mark Sold</button>'
      :'<button class="btn btn-success btn-sm" onclick="_toggleStatus(\''+p.id+'\')">&#128994; Mark Active</button>';
    return '<tr>'
      +'<td><input type="checkbox" class="row-chk" data-id="'+p.id+'" style="accent-color:#C4622D;"></td>'
      +'<td><div style="display:flex;align-items:center;gap:10px;">'
        +(p.thumbnail?'<div class="prod-thumb" style="overflow:hidden;"><img src="../'+p.thumbnail+'" alt="'+p.name+'" style="width:100%;height:100%;object-fit:cover;display:block;"></div>':'<div class="prod-thumb" style="background:linear-gradient(135deg,'+(p.gradientFrom||'#8B1A4A')+','+(p.gradientTo||'#C4622D')+');"></div>')
        +'<div><div style="font-weight:600;color:#1A0A04;font-size:13px;">'+p.name+'</div><div style="font-size:11px;color:#9A8070;">'+p.id+'</div></div>'
      +'</div></td>'
      +'<td style="color:#5A4030;">'+(p.type||'')+'</td>'
      +'<td style="color:#5A4030;">'+(p.fabric||'')+'</td>'
      +'<td>'+priceHtml+'</td>'
      +'<td>'+_statusBadge(p.status)+'</td>'
      +'<td><div style="display:flex;gap:6px;">'
        +'<a href="amayaa_product_edit.html?id='+encodeURIComponent(p.id)+'" class="btn btn-edit btn-sm">&#9998; Edit</a>'
        +toggleBtn
        +'<button class="btn btn-danger btn-sm" onclick="_deleteProduct(\''+p.id+'\')">&#128465;</button>'
      +'</div></td>'
      +'</tr>';
  }).join('');
  _renderPagination();
}

function _renderPagination(){
  var pagEl=document.querySelector('.pag');
  if(!pagEl)return;
  var pages=Math.ceil(_filtered.length/PAGE_SIZE)||1;
  var btns='<div class="pag-btn" onclick="_goPage('+(Math.max(0,_curPage-1))+')">&#8592;</div>';
  for(var i=0;i<pages;i++){
    btns+='<div class="pag-btn'+(i===_curPage?' active':'')+'" onclick="_goPage('+i+')">'+(i+1)+'</div>';
    if(i===2&&pages>5){btns+='<span style="color:#B0967E;font-size:12px;">…</span>';i=pages-2;}
  }
  btns+='<div class="pag-btn" onclick="_goPage('+(Math.min(pages-1,_curPage+1))+')">&#8594;</div>';
  pagEl.innerHTML=btns;
}

function _goPage(n){_curPage=n;_renderTable();}

function _updateStats(){
  var total=_products.length;
  var active=_products.filter(function(p){return p.status==='active';}).length;
  var sold=_products.filter(function(p){return p.status==='sold_out';}).length;
  var hidden=_products.filter(function(p){return p.status==='hidden';}).length;
  var elT=document.getElementById('stat-total');if(elT)elT.textContent=total;
  var elA=document.getElementById('stat-active');if(elA)elA.textContent=active;
  var elS=document.getElementById('stat-sold');if(elS)elS.textContent=sold;
  var elH=document.getElementById('stat-hidden');if(elH)elH.textContent=hidden;
  // update pill counts
  document.querySelectorAll('[data-filter]').forEach(function(pill){
    var f=pill.dataset.filter;
    var cnt=f==='all'?total:f==='active'?active:f==='sold_out'?sold:f==='hidden'?hidden
      :f==='offer'?_products.filter(function(p){return p.badges&&p.badges.indexOf('offer')>-1;}).length
      :f==='new'?_products.filter(function(p){return p.badges&&p.badges.indexOf('new')>-1;}).length:0;
    pill.textContent=pill.textContent.replace(/\s*\(\d+\)/,'');
    pill.textContent+=' ('+cnt+')';
  });
}

function _applyFilter(){
  var q=(document.getElementById('prodSearch')||{}).value||'';
  q=q.toLowerCase().trim();
  var region=(document.getElementById('filterRegion')||{}).value||'';
  var fabric=(document.getElementById('filterFabric')||{}).value||'';
  var sort=(document.getElementById('filterSort')||{}).value||'newest';

  _filtered=_products.filter(function(p){
    var mf=true;
    if(_activeFilter==='active') mf=p.status==='active';
    else if(_activeFilter==='sold_out') mf=p.status==='sold_out';
    else if(_activeFilter==='hidden') mf=p.status==='hidden';
    else if(_activeFilter==='offer') mf=p.badges&&p.badges.indexOf('offer')>-1;
    else if(_activeFilter==='new') mf=p.badges&&p.badges.indexOf('new')>-1;
    var mq=!q||(p.name&&p.name.toLowerCase().indexOf(q)>-1)||(p.type&&p.type.toLowerCase().indexOf(q)>-1)||(p.id&&p.id.toLowerCase().indexOf(q)>-1)||(p.fabric&&p.fabric.toLowerCase().indexOf(q)>-1);
    var mr=!region||(p.type&&p.type===region);
    var mfab=!fabric||(p.fabric&&p.fabric.indexOf(fabric)>-1);
    return mf&&mq&&mr&&mfab;
  });

  if(sort==='az') _filtered.sort(function(a,b){return (a.name||'').localeCompare(b.name||'');});
  else if(sort==='price-asc') _filtered.sort(function(a,b){return (a.price||0)-(b.price||0);});
  else if(sort==='price-desc') _filtered.sort(function(a,b){return (b.price||0)-(a.price||0);});
  // 'newest' = original order (as loaded from JSON)

  _curPage=0;
  _renderTable();
}

function _toggleStatus(id){
  var p=_products.find(function(x){return x.id===id;});
  if(!p)return;
  p.status=p.status==='active'?'sold_out':'active';
  _updateStats();_applyFilter();
  _ghSave('data/products_index.json',_products,'Update status: '+id,null);
}

function _deleteProduct(id){
  if(!confirm('Delete '+id+'? Cannot be undone.'))return;
  _products=_products.filter(function(p){return p.id!==id;});
  _updateStats();_applyFilter();
  _ghSave('data/products_index.json',_products,'Delete product: '+id,null);
}

function _selectAll(checked){
  document.querySelectorAll('.row-chk').forEach(function(c){c.checked=checked;});
}

function _selectedIds(){
  return Array.from(document.querySelectorAll('.row-chk:checked')).map(function(c){return c.dataset.id;});
}

function _bulkStatus(newStatus){
  var ids=_selectedIds();
  if(!ids.length){alert('Select at least one product.');return;}
  ids.forEach(function(id){var p=_products.find(function(x){return x.id===id;});if(p)p.status=newStatus;});
  _updateStats();_applyFilter();
  _ghSave('data/products_index.json',_products,'Bulk status → '+newStatus,null);
}

function _bulkBadge(badge){
  var ids=_selectedIds();
  if(!ids.length){alert('Select at least one product.');return;}
  ids.forEach(function(id){
    var p=_products.find(function(x){return x.id===id;});
    if(p){p.badges=p.badges||[];if(p.badges.indexOf(badge)<0)p.badges.push(badge);}
  });
  _updateStats();_applyFilter();
  _ghSave('data/products_index.json',_products,'Bulk badge: '+badge,null);
}

function _bulkDelete(){
  var ids=_selectedIds();
  if(!ids.length){alert('Select at least one product.');return;}
  if(!confirm('Delete '+ids.length+' product(s)? Cannot be undone.'))return;
  _products=_products.filter(function(p){return ids.indexOf(p.id)<0;});
  _updateStats();_applyFilter();
  _ghSave('data/products_index.json',_products,'Bulk delete '+ids.length+' products',null);
}

function _csvUpload(){
  alert('CSV bulk upload: prepare a CSV with columns id,name,type,fabric,price,originalPrice,status\nThen paste or upload — coming soon.\n\nFor now, edit products one by one using the ✎ Edit button.');
}

document.addEventListener('DOMContentLoaded',function(){
  fetch('../data/products_index.json?_='+Date.now())
    .then(function(r){return r.json();})
    .then(function(data){_products=Array.isArray(data)?data:[];_updateStats();_applyFilter();})
    .catch(function(e){console.error('Failed to load products:',e);});

  var searchEl=document.getElementById('prodSearch');
  if(searchEl) searchEl.addEventListener('keyup',_applyFilter);

  ['filterRegion','filterFabric','filterSort'].forEach(function(id){
    var el=document.getElementById(id);
    if(el) el.addEventListener('change',_applyFilter);
  });

  document.querySelectorAll('[data-filter]').forEach(function(pill){
    pill.addEventListener('click',function(){
      document.querySelectorAll('[data-filter]').forEach(function(p){p.classList.remove('active');});
      pill.classList.add('active');
      _activeFilter=pill.dataset.filter;
      _applyFilter();
    });
  });
});
</script>
<script src="sidebar.js"></script>
</body></html>
