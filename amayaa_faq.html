<title>FAQs — Amayaa by Polka Dots</title>
<meta name="description" content="Frequently asked questions about handloom sarees, ordering, shipping, care, and more — Amayaa by Polka Dots.">

<link rel="stylesheet" href="public.css">
<style>
:root{}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Jost',sans-serif;background:#E4EEE0;color:#1A1208;font-size:15px;}
.orbs{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.6;animation:fl 20s ease-in-out infinite;}
.o1{width:500px;height:500px;background:#B4D8C8;top:-100px;left:-80px;}
.o2{width:420px;height:420px;background:#C8D4B0;top:25%;right:-80px;animation-delay:-7s;}
.o3{width:380px;height:380px;background:#D0C4B8;bottom:15%;left:8%;animation-delay:-13s;}
.o4{width:320px;height:320px;background:#B8C8D8;bottom:-80px;right:15%;animation-delay:-5s;}
.o5{width:260px;height:260px;background:#D4B8C0;top:50%;left:40%;animation-delay:-10s;}
@keyframes fl{0%,100%{transform:translate(0,0);}50%{transform:translate(20px,-30px);}}

/* ── Page wrapper ── */
.page{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:40px 36px 80px;}

/* ── Hero band ── */
.faq-hero{text-align:center;padding:60px 0 48px;}
.sec-lbl{font-size:11px;letter-spacing:4px;text-transform:uppercase;font-weight:500;color:#A04010;margin-bottom:12px;}
.sec-ttl{font-family:'Cormorant Garamond',serif;font-size:clamp(32px,4.5vw,58px);font-weight:300;color:#1A0A04;line-height:1.1;margin-bottom:16px;}
.faq-sub{font-size:14px;color:#7A6050;line-height:1.8;max-width:480px;margin:0 auto 36px;}

/* ── Search bar ── */
.faq-search{position:relative;max-width:540px;margin:0 auto 48px;}
.faq-search input{width:100%;padding:14px 48px 14px 20px;border-radius:50px;border:1.5px solid rgba(196,98,45,.25);background:rgba(255,255,255,.8);backdrop-filter:blur(12px);font-family:'Jost',sans-serif;font-size:14px;color:#1A0A04;outline:none;transition:border-color .2s,box-shadow .2s;}
.faq-search input:focus{border-color:rgba(196,98,45,.5);box-shadow:0 0 0 3px rgba(196,98,45,.1);}
.faq-search input::placeholder{color:#B0967E;}
.faq-search svg{position:absolute;right:18px;top:50%;transform:translateY(-50%);color:#B0967E;pointer-events:none;}

/* ── Category chips ── */
.faq-cats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:40px;}
.faq-cat{padding:8px 20px;border-radius:50px;border:1.5px solid rgba(196,98,45,.25);background:rgba(255,255,255,.7);font-family:'Jost',sans-serif;font-size:12px;font-weight:500;letter-spacing:1px;color:#7A6050;cursor:pointer;transition:all .2s;text-transform:uppercase;}
.faq-cat:hover{border-color:rgba(196,98,45,.5);color:#C4622D;}
.faq-cat.active{background:rgba(196,98,45,.12);border-color:rgba(196,98,45,.4);color:#C4622D;font-weight:600;}

/* ── FAQ group ── */
.faq-group{margin-bottom:40px;}
.faq-group-title{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:400;color:#1A0A04;margin-bottom:16px;display:flex;align-items:center;gap:12px;}
.faq-group-title::after{content:'';flex:1;height:1px;background:rgba(196,98,45,.2);}
.faq-group-icon{font-size:22px;}

/* ── Accordion item ── */
.faq-item{background:rgba(255,255,255,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.88);border-radius:16px;margin-bottom:10px;box-shadow:0 3px 14px rgba(0,0,0,.06);overflow:hidden;transition:box-shadow .2s;}
.faq-item:hover{box-shadow:0 6px 22px rgba(0,0,0,.1);}
.faq-item.open{border-color:rgba(196,98,45,.25);}
.faq-q{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 24px;cursor:pointer;user-select:none;}
.faq-q-text{font-size:15px;font-weight:500;color:#1A0A04;line-height:1.5;}
.faq-toggle{width:28px;height:28px;border-radius:50%;background:rgba(196,98,45,.1);border:1px solid rgba(196,98,45,.2);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .25s;color:#C4622D;}
.faq-item.open .faq-toggle{background:rgba(196,98,45,.18);transform:rotate(45deg);}
.faq-a{max-height:0;overflow:hidden;transition:max-height .35s ease;}
.faq-item.open .faq-a{max-height:600px;}
.faq-a-inner{padding:0 24px 22px;font-size:14px;line-height:1.9;color:#4A3828;border-top:1px solid rgba(196,98,45,.1);}
.faq-a-inner p{padding-top:16px;}
.faq-a-inner a{color:#C4622D;text-decoration:none;font-weight:600;}
.faq-a-inner a:hover{text-decoration:underline;}
.faq-a-inner ul{list-style:none;padding-top:10px;}
.faq-a-inner ul li{padding:5px 0 5px 18px;position:relative;font-size:13px;}
.faq-a-inner ul li::before{content:'✦';position:absolute;left:0;color:#C4622D;font-size:8px;top:8px;}

/* ── Still need help banner ── */
.faq-cta{background:rgba(196,98,45,.08);border:1px solid rgba(196,98,45,.2);border-radius:20px;padding:40px;text-align:center;margin-top:48px;}
.faq-cta h3{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:400;color:#1A0A04;margin-bottom:10px;}
.faq-cta p{font-size:14px;color:#7A6050;margin-bottom:24px;line-height:1.7;}
.faq-cta-btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
.btn-wa{display:inline-flex;align-items:center;gap:8px;padding:13px 28px;border-radius:50px;background:linear-gradient(135deg,#25D366,#128C7E);color:white;text-decoration:none;font-family:'Jost',sans-serif;font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;transition:all .3s;}
.btn-wa:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(37,211,102,.4);}
.btn-mail{display:inline-flex;align-items:center;gap:8px;padding:13px 28px;border-radius:50px;border:1.5px solid rgba(196,98,45,.4);background:rgba(255,255,255,.6);color:#C4622D;text-decoration:none;font-family:'Jost',sans-serif;font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;transition:all .3s;}
.btn-mail:hover{background:rgba(196,98,45,.1);}

/* ── No results ── */
.faq-no-results{text-align:center;padding:60px 20px;display:none;}
.faq-no-results p{font-size:15px;color:#9A8070;}

/* ── WA float ── */
.waf{position:fixed;bottom:30px;right:30px;z-index:1000;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#25D366,#128C7E);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(37,211,102,.45);text-decoration:none;transition:all .3s;animation:wap 3s ease-in-out infinite;}
.waf:hover{transform:scale(1.1);}
@keyframes wap{0%,100%{box-shadow:0 8px 24px rgba(37,211,102,.45);}50%{box-shadow:0 8px 32px rgba(37,211,102,.7),0 0 0 8px rgba(37,211,102,.12);}}

/* ── Mobile ── */
@media(max-width:768px){
  .page{padding:20px 16px 60px;}
  .faq-hero{padding:40px 0 28px;}
  .faq-q{padding:16px 18px;}
  .faq-a-inner{padding:0 18px 18px;}
  .faq-cta{padding:28px 20px;}
  .faq-cats{gap:8px;}
  .faq-cat{padding:7px 14px;font-size:11px;}
}
</style>
<script src="gate.js"></script>
</head>

<script>
/* ── Accordion toggle ── */
function toggleFaq(qEl){
  var item = qEl.parentElement;
  var isOpen = item.classList.contains('open');
  // Close all
  document.querySelectorAll('.faq-item.open').forEach(function(i){ i.classList.remove('open'); });
  // Open clicked if it was closed
  if(!isOpen) item.classList.add('open');
}

/* ── Category filter ── */
function filterCat(cat, btn){
  document.querySelectorAll('.faq-cat').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  document.getElementById('faq-search-input').value = '';
  document.querySelectorAll('.faq-group, .faq-item').forEach(function(el){
    el.style.display = (cat === 'all' || el.dataset.cat === cat) ? '' : 'none';
  });
  document.getElementById('faq-no-results').style.display = 'none';
}

/* ── Search ── */
function faqSearch(query){
  var q = query.toLowerCase().trim();
  // Reset category
  document.querySelectorAll('.faq-cat').forEach(function(b){ b.classList.remove('active'); });
  document.querySelector('.faq-cat').classList.add('active');

  var items = document.querySelectorAll('.faq-item');
  var groups = document.querySelectorAll('.faq-group');
  var anyVisible = false;

  items.forEach(function(item){
    var text = item.textContent.toLowerCase();
    var match = !q || text.indexOf(q) > -1;
    item.style.display = match ? '' : 'none';
    if(match) anyVisible = true;
  });

  // Show/hide groups based on whether they have visible items
  groups.forEach(function(group){
    var visible = Array.from(group.querySelectorAll('.faq-item')).some(function(i){ return i.style.display !== 'none'; });
    group.style.display = visible ? '' : 'none';
  });

  document.getElementById('faq-no-results').style.display = anyVisible ? 'none' : 'block';
}
</script>

<script>
/* ── Load FAQ from data/faq.json ── */
(function(){
  var _fallback = null; /* will use fetch only */

  function _esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  function _render(data){
    /* Update hero if fields present */
    if(data.pageSubtitle){
      var sub = document.querySelector('.faq-sub');
      if(sub) sub.textContent = data.pageSubtitle;
    }

    /* Render groups */
    var container = document.getElementById('faq-dynamic-content');
    if(!container) return;
    var html = '';
    (data.groups||[]).forEach(function(g){
      html += '<div class="faq-group" data-cat="'+_esc(g.id)+'">';
      html += '<h2 class="faq-group-title"><span class="faq-group-icon">'+g.icon+'</span> '+_esc(g.label)+'</h2>';
      (g.items||[]).forEach(function(item){
        html += '<div class="faq-item" data-cat="'+_esc(g.id)+'">';
        html += '<div class="faq-q" onclick="toggleFaq(this)">';
        html += '<span class="faq-q-text">'+_esc(item.question)+'</span>';
        html += '<span class="faq-toggle"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg></span>';
        html += '</div>';
        html += '<div class="faq-a"><div class="faq-a-inner">'+item.answer+'</div></div>';
        html += '</div>';
      });
      html += '</div>';
    });
    container.innerHTML = html;

    /* Render CTA */
    var cta = document.getElementById('faq-cta');
    if(cta){
      if(data.ctaTitle) document.getElementById('faq-cta-title').textContent = data.ctaTitle;
      if(data.ctaText)  document.getElementById('faq-cta-text').textContent  = data.ctaText;
      cta.style.display = '';
    }

    /* Re-wire category filter chips with new DOM */
    _rewireChips();
  }

  function _rewireChips(){
    /* chips were wired before dynamic content rendered — re-apply active filter */
    var activeBtn = document.querySelector('.faq-chip.active');
    if(activeBtn) filterCat(activeBtn.dataset.cat, activeBtn);
  }

  fetch('data/faq.json')
    .then(function(r){ if(!r.ok) throw new Error(); return r.json(); })
    .then(function(data){ _render(data); })
    .catch(function(){
      document.getElementById('faq-dynamic-content').innerHTML =
        '<p style="text-align:center;padding:40px;color:#9A8070;">Could not load FAQ content. Please try refreshing the page.</p>';
    });
})();
</script>
