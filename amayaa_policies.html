<style>
:root{}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Jost',sans-serif;background:#E4EEE0;color:#1A1208;font-size:15px;}
.orbs{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.6;animation:fl 20s ease-in-out infinite;}
.o1{width:500px;height:500px;background:#C8B4D0;top:-100px;left:-80px;}
.o2{width:420px;height:420px;background:#D4C0E0;top:25%;right:-80px;animation-delay:-7s;}
.o3{width:380px;height:380px;background:#B8D4A0;bottom:15%;left:8%;animation-delay:-13s;}
.o4{width:320px;height:320px;background:#D0B8C8;bottom:-80px;right:15%;animation-delay:-5s;}
.o5{width:260px;height:260px;background:#E0C8B8;top:50%;left:40%;animation-delay:-10s;}
@keyframes fl{0%,100%{transform:translate(0,0);}50%{transform:translate(20px,-30px);}}

/* ── Page wrapper ── */
.page{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:40px 36px 80px;}

/* ── Hero band ── */
.pol-hero{text-align:center;padding:60px 0 48px;}
.sec-lbl{font-size:11px;letter-spacing:4px;text-transform:uppercase;font-weight:500;color:#A04010;margin-bottom:12px;}
.sec-ttl{font-family:'Cormorant Garamond',serif;font-size:clamp(32px,4.5vw,58px);font-weight:300;color:#1A0A04;line-height:1.1;margin-bottom:16px;}
.pol-sub{font-size:14px;color:#7A6050;line-height:1.8;max-width:520px;margin:0 auto;}

/* ── Layout: sidebar + content ── */
.pol-layout{display:grid;grid-template-columns:220px 1fr;gap:36px;align-items:start;}

/* ── Sticky sidebar nav ── */
.pol-nav{position:sticky;top:110px;}
.pol-nav-inner{background:rgba(255,255,255,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.88);border-radius:18px;padding:24px 20px;box-shadow:0 4px 20px rgba(0,0,0,.07);}
.pol-nav-title{font-size:10px;letter-spacing:3px;text-transform:uppercase;font-weight:600;color:#A04010;margin-bottom:16px;}
.pol-nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;text-decoration:none;font-size:13px;font-weight:500;color:#5A4030;transition:all .2s;margin-bottom:4px;border:1px solid transparent;}
.pol-nav a:hover{background:rgba(196,98,45,.08);color:#C4622D;}
.pol-nav a.active{background:rgba(196,98,45,.12);color:#C4622D;border-color:rgba(196,98,45,.2);font-weight:600;}
.pol-nav a .nav-icon{font-size:16px;flex-shrink:0;}
.pol-updated{font-size:11px;color:#AAA090;margin-top:20px;padding-top:16px;border-top:1px solid rgba(0,0,0,.08);line-height:1.6;}

/* ── Content area ── */
.pol-content{}
.pol-section{background:rgba(255,255,255,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.88);border-radius:20px;padding:40px 44px;margin-bottom:28px;box-shadow:0 4px 20px rgba(0,0,0,.07);scroll-margin-top:120px;}
.pol-section-label{font-size:10px;letter-spacing:3px;text-transform:uppercase;font-weight:600;color:#A04010;margin-bottom:10px;}
.pol-section-title{font-family:'Cormorant Garamond',serif;font-size:clamp(22px,2.8vw,34px);font-weight:400;color:#1A0A04;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid rgba(196,98,45,.15);}
.pol-section p{font-size:14px;line-height:1.9;color:#4A3828;margin-bottom:16px;}
.pol-section p:last-child{margin-bottom:0;}
.pol-section h4{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600;color:#1A0A04;margin:24px 0 10px;}
.pol-list{list-style:none;margin:0 0 16px;}
.pol-list li{font-size:14px;line-height:1.8;color:#4A3828;padding:6px 0 6px 22px;position:relative;border-bottom:1px solid rgba(0,0,0,.05);}
.pol-list li:last-child{border-bottom:none;}
.pol-list li::before{content:'✦';position:absolute;left:0;color:#C4622D;font-size:9px;top:10px;}
.pol-highlight{background:rgba(196,98,45,.07);border-left:3px solid #C4622D;border-radius:0 10px 10px 0;padding:14px 18px;margin:20px 0;font-size:13px;color:#6A3820;line-height:1.8;}
.pol-badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:1px;background:rgba(196,98,45,.12);color:#A04010;margin-bottom:16px;}
.pol-contact-box{background:rgba(196,98,45,.06);border:1px solid rgba(196,98,45,.18);border-radius:14px;padding:20px 24px;margin-top:24px;}
.pol-contact-box p{font-size:13px;color:#6A3820;margin-bottom:6px;}
.pol-contact-box a{color:#C4622D;text-decoration:none;font-weight:600;}
.pol-contact-box a:hover{text-decoration:underline;}

/* ── WA float ── */
.waf{position:fixed;bottom:30px;right:30px;z-index:1000;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#25D366,#128C7E);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(37,211,102,.45);text-decoration:none;transition:all .3s;animation:wap 3s ease-in-out infinite;}
.waf:hover{transform:scale(1.1);}
@keyframes wap{0%,100%{box-shadow:0 8px 24px rgba(37,211,102,.45);}50%{box-shadow:0 8px 32px rgba(37,211,102,.7),0 0 0 8px rgba(37,211,102,.12);}}

/* ── Mobile ── */
@media(max-width:768px){
  .page{padding:20px 16px 60px;}
  .pol-hero{padding:40px 0 32px;}
  .pol-layout{grid-template-columns:1fr;}
  .pol-nav{position:static;margin-bottom:8px;}
  .pol-nav-inner{padding:16px;}
  .pol-nav a{padding:8px 10px;font-size:12px;}
  .pol-section{padding:24px 20px;}
  .pol-nav-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none;}
  .pol-nav-scroll::-webkit-scrollbar{display:none;}
  .pol-nav-scroll .pol-nav-title{display:none;}
  .pol-nav-scroll a{white-space:nowrap;flex-shrink:0;}
}
</style>

<script>
/* ── Load Policies from data/policies.json ── */
(function(){
  function _esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function _render(data){
    /* Update hero */
    var heroSub = document.querySelector('.pol-sub');
    if(heroSub && data.pageSubtitle) heroSub.textContent = data.pageSubtitle;

    /* Update sidebar nav links */
    var navInner = document.querySelector('.pol-nav-scroll');
    if(navInner && data.sections){
      var navHtml = '<div class="pol-nav-title">Jump to section</div>';
      data.sections.forEach(function(s){
        navHtml += '<a href="#'+s.id+'" class="pol-nav-link">';
        navHtml += '<span class="nav-icon">'+s.icon+'</span> '+_esc(s.title);
        navHtml += '</a>';
      });
      navInner.innerHTML = navHtml;
    }

    /* Render sections */
    var container = document.getElementById('pol-dynamic-content');
    if(!container || !data.sections) return;
    var html = '';
    data.sections.forEach(function(s, i){
      html += '<section class="pol-section" id="'+s.id+'">';
      html += '<div class="pol-section-label">'+_esc(s.label)+'</div>';
      html += '<h2 class="pol-section-title">'+_esc(s.title)+'</h2>';
      if(s.highlight){
        html += '<div class="pol-highlight">'+_esc(s.highlight)+'</div>';
      }
      html += s.content; /* HTML content rendered directly */
      html += '</section>';
    });
    container.innerHTML = html;

    /* Scroll spy — re-init after DOM update */
    _initScrollSpy();
  }

  function _initScrollSpy(){
    var sections = document.querySelectorAll('.pol-section');
    var links    = document.querySelectorAll('.pol-nav-link');
    if(!sections.length || !links.length) return;
    window.addEventListener('scroll', function(){
      var scrollY = window.scrollY + 140;
      sections.forEach(function(sec){
        if(sec.offsetTop <= scrollY && sec.offsetTop + sec.offsetHeight > scrollY){
          var id = sec.getAttribute('id');
          links.forEach(function(a){
            a.classList.toggle('active', a.getAttribute('href') === '#'+id);
          });
        }
      });
    }, {passive:true});
  }

  fetch('data/policies.json')
    .then(function(r){ if(!r.ok) throw new Error(); return r.json(); })
    .then(function(data){ _render(data); })
    .catch(function(){
      document.getElementById('pol-dynamic-content').innerHTML =
        '<p style="text-align:center;padding:40px;color:#9A8070;">Could not load policy content. Please try refreshing the page.</p>';
    });
})();
</script>
